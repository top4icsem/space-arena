services:
  space-arena:
    build:
      context: .
      args:
        BUILD_SHA: ${BUILD_SHA:-local}
        BUILD_TAG: ${BUILD_TAG:-development}
    init: true
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      MAX_CONNECTIONS_PER_IP: ${MAX_CONNECTIONS_PER_IP:-8}
      MAX_ROOMS: ${MAX_ROOMS:-24}
      MAX_PLAYERS: ${MAX_PLAYERS:-8}
    stop_grace_period: 10s
    restart: unless-stopped
