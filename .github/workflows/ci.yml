name: Space Arena Lab 07 — types, tests, coverage, browsers
on:
  push:
    branches: [main]
    tags: ['lab-*']
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Lint, legacy + Vitest tests, shared coverage >=85%, build
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: 'Two real browser contexts: movement + chat'
        run: |
          touch .env
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab07-coverage-playwright
          path: |
            coverage/
            playwright-report/
            test-results/
          if-no-files-found: ignore
